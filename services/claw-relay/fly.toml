# The Claw Messenger relay (plan §23): one always-on machine for the fleet. It holds the
# vendor's WebSocket, which Convex cannot; nothing else in the product needs a process.
# Secrets: fly secrets set CLAW_API_KEY=… CONVEX_WEBHOOK_URL=… CLAW_WEBHOOK_SECRET=…
app = "heymaya-claw-relay"
primary_region = "ewr"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
