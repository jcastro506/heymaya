app = "heymaya-openclaw"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    # Must match the Dockerfile default + the OPENCLAW_IMAGE_TARGET tag in
    # deployMayaGtm.ts. Was stale at 2026.4.23 while the fleet image ran
    # 2026.5.26 — bit us on the 2026-07-10 registry rebuild.
    OPENCLAW_VERSION = "2026.5.26"

[env]
  OPENCLAW_STATE_DIR = "/data"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
