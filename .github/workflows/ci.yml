name: ci

on:
  pull_request:
  push:
    branches: [creator, creator-main, staging, main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: tests (unit, contract, integration on fixtures, mandatory categories)
        run: npm run test -- --run
      - name: guards (copy grep, chat-completeness registry, scar-tissue list, stray files)
        run: npm run guards
      - name: web build
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
